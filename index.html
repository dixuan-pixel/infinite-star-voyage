<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#010105">
  <title>Infinite Star Voyage</title>
  <meta name="description" content="A textless, endlessly randomized voyage through deep space.">
  <meta property="og:title" content="Infinite Star Voyage">
  <meta property="og:description" content="An endless randomized journey through deep space.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dixuan-pixel.github.io/infinite-star-voyage/">
  <meta property="og:image" content="https://dixuan-pixel.github.io/infinite-star-voyage/og.png">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #010105; }
    body { cursor: crosshair; }
    canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
    .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle at center, transparent 37%, rgba(0,0,8,.13) 67%, rgba(0,0,5,.72) 118%); }
    @media (pointer: coarse) { body { cursor: default; } }
  </style>
</head>
<body>
  <canvas></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <script>
    const canvas = document.querySelector('canvas');
    const context = canvas.getContext('2d');
    const STAR_COUNT = 1500;
    let frame = 0;
    let width = 1;
    let height = 1;
    let dpr = 1;
    let last = performance.now();
    let centerX = 0;
    let centerY = 0;
    let targetX = 0;
    let targetY = 0;
    let driftX = 0;
    let driftY = 0;
    let nextTurn = 0;
    let velocity = 0.0052 + Math.random() * 0.002;
    let targetVelocity = velocity;
    let clouds = [];

    function randomStar(z = Math.random()) {
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.pow(Math.random(), 0.55) * 1.55 + 0.025;
      return {
        x: Math.cos(angle) * radius,
        y: Math.sin(angle) * radius,
        z: Math.max(0.018, z),
        previousZ: 1,
        size: 0.32 + Math.random() * 1.9,
        hue: Math.random() < 0.62 ? 205 + Math.random() * 26 : Math.random() < 0.7 ? 258 + Math.random() * 38 : 175 + Math.random() * 20,
        shimmer: Math.random() * Math.PI * 2
      };
    }

    function randomCloud() {
      return {
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.max(width, height) * (0.22 + Math.random() * 0.34),
        hue: 188 + Math.random() * 110,
        alpha: 0.018 + Math.random() * 0.052,
        vx: (Math.random() - 0.5) * 0.035,
        vy: (Math.random() - 0.5) * 0.035
      };
    }

    const stars = Array.from({ length: STAR_COUNT }, () => randomStar());

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = innerWidth;
      height = innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      context.setTransform(dpr, 0, 0, dpr, 0, 0);
      centerX = width * 0.5;
      centerY = height * 0.5;
      targetX = centerX;
      targetY = centerY;
      if (!clouds.length) clouds = Array.from({ length: 7 }, randomCloud);
    }

    function chooseNewCourse(now) {
      const reach = Math.min(width, height) * (0.07 + Math.random() * 0.16);
      const angle = Math.random() * Math.PI * 2;
      targetX = width * 0.5 + Math.cos(angle) * reach;
      targetY = height * 0.5 + Math.sin(angle) * reach;
      targetVelocity = 0.0036 + Math.random() * 0.0068;
      nextTurn = now + 1200 + Math.random() * 5200;
    }

    function drawCloud(cloud, delta) {
      cloud.x += cloud.vx * delta;
      cloud.y += cloud.vy * delta;
      if (cloud.x < -cloud.radius) cloud.x = width + cloud.radius;
      if (cloud.x > width + cloud.radius) cloud.x = -cloud.radius;
      if (cloud.y < -cloud.radius) cloud.y = height + cloud.radius;
      if (cloud.y > height + cloud.radius) cloud.y = -cloud.radius;
      const gradient = context.createRadialGradient(cloud.x, cloud.y, 0, cloud.x, cloud.y, cloud.radius);
      gradient.addColorStop(0, `hsla(${cloud.hue},90%,58%,${cloud.alpha})`);
      gradient.addColorStop(0.42, `hsla(${cloud.hue + 18},92%,48%,${cloud.alpha * 0.32})`);
      gradient.addColorStop(1, 'rgba(0,0,0,0)');
      context.fillStyle = gradient;
      context.fillRect(cloud.x - cloud.radius, cloud.y - cloud.radius, cloud.radius * 2, cloud.radius * 2);
    }

    function draw(now) {
      const delta = Math.min((now - last) / 16.667, 2.4);
      last = now;
      if (now > nextTurn) chooseNewCourse(now);
      driftX += (Math.random() - 0.5) * 0.018 * delta;
      driftY += (Math.random() - 0.5) * 0.018 * delta;
      driftX *= Math.pow(0.986, delta);
      driftY *= Math.pow(0.986, delta);
      centerX += (targetX + driftX * width * 0.12 - centerX) * 0.006 * delta;
      centerY += (targetY + driftY * height * 0.12 - centerY) * 0.006 * delta;
      velocity += (targetVelocity - velocity) * 0.012 * delta;

      context.fillStyle = '#010105';
      context.fillRect(0, 0, width, height);
      clouds.forEach(cloud => drawCloud(cloud, delta));
      const scale = Math.min(width, height) * 0.69;
      context.globalCompositeOperation = 'lighter';

      for (const star of stars) {
        const oldZ = star.z;
        star.z -= velocity * delta;
        const x = centerX + star.x / star.z * scale;
        const y = centerY + star.y / star.z * scale;
        const tailZ = Math.max(star.previousZ, star.z + velocity * (5 + Math.random() * 4));
        const previousX = centerX + star.x / tailZ * scale;
        const previousY = centerY + star.y / tailZ * scale;

        if (star.z < 0.014 || x < -180 || x > width + 180 || y < -180 || y > height + 180) {
          Object.assign(star, randomStar(0.91 + Math.random() * 0.09));
          continue;
        }

        const proximity = Math.min(1, (1 - star.z) * 1.9 + 0.12);
        const pulse = 0.82 + Math.sin(now * 0.0017 + star.shimmer) * 0.18;
        context.beginPath();
        context.moveTo(previousX, previousY);
        context.lineTo(x, y);
        context.lineCap = 'round';
        context.lineWidth = star.size * Math.max(0.5, proximity * 2.45);
        context.strokeStyle = `hsla(${star.hue},94%,${star.hue > 250 ? 76 : 89}%,${proximity * pulse})`;
        context.stroke();
        star.previousZ = oldZ;
      }

      const coreSize = 65 + velocity * 4200;
      const core = context.createRadialGradient(centerX, centerY, 0, centerX, centerY, coreSize);
      core.addColorStop(0, 'rgba(238,254,255,.98)');
      core.addColorStop(0.025, 'rgba(111,232,255,.8)');
      core.addColorStop(0.16, 'rgba(88,109,255,.17)');
      core.addColorStop(1, 'rgba(0,0,0,0)');
      context.fillStyle = core;
      context.fillRect(centerX - coreSize, centerY - coreSize, coreSize * 2, coreSize * 2);
      context.globalCompositeOperation = 'source-over';
      frame = requestAnimationFrame(draw);
    }

    addEventListener('resize', resize);
    addEventListener('pointerdown', event => {
      targetX = event.clientX;
      targetY = event.clientY;
      targetVelocity = 0.006 + Math.random() * 0.008;
      nextTurn = performance.now() + 800 + Math.random() * 1800;
    });
    resize();
    chooseNewCourse(performance.now());
    frame = requestAnimationFrame(draw);
  </script>
</body>
</html>
